<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tatame · Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Ícones agora são SVG inline via função icon() em JS -->
<style>
.i-svg { display: inline-flex; align-items: center; justify-content: center; vertical-align: -0.15em; }
.i-svg svg { display: block; }
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* === TEMA ESCURO (padrão) === */
  :root, [data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --surface-3: #232323;
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --text: #ffffff;
    --text-2: #a8a8a8;
    --text-3: #6a6a6a;
    --text-4: #555;
    --primary: #e63946;
    --primary-dark: #b82934;
    --primary-soft: rgba(230,57,70,0.12);
    --green: #6ee06e;
    --green-bg: rgba(110,224,110,0.12);
    --red: #ff6b6b;
    --red-bg: rgba(255,107,107,0.12);
    --amber: #ffaa33;
    --amber-bg: rgba(255,170,51,0.12);
    --blue: #4488ff;
    --purple: #aa66ff;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --radius-xl: 22px;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.15);
  }

  /* === TEMA CLARO === */
  [data-theme="light"] {
    --bg: #fafaf7;
    --surface: #ffffff;
    --surface-2: #f4f2ec;
    --surface-3: #ebe8e0;
    --border: rgba(0,0,0,0.08);
    --border-2: rgba(0,0,0,0.14);
    --text: #2a2a2a;
    --text-2: #6a6a6a;
    --text-3: #a0a0a0;
    --text-4: #b8b8b8;
    --primary: #e63946;
    --primary-dark: #b82934;
    --primary-soft: rgba(230,57,70,0.08);
    --green: #2ea043;
    --green-bg: rgba(46,160,67,0.12);
    --red: #d63030;
    --red-bg: rgba(214,48,48,0.10);
    --amber: #d97706;
    --amber-bg: rgba(217,119,6,0.10);
    --blue: #2563eb;
    --purple: #7c3aed;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px;
    overflow-x: hidden;
    transition: background-color 0.2s, color 0.2s;
  }
  body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  #app { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 100px; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea {
    font-family: inherit;
    font-size: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 14px 16px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--text); }

  /* Tipografia */
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; }
  .display-font { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.02em; }
  .grotesk { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Wordmark (logo) */
  .wordmark {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1;
    display: inline-block;
  }
  .wordmark .dot { color: var(--primary); }
  .wordmark.lg { font-size: 56px; }
  .wordmark.md { font-size: 32px; }
  .wordmark.sm { font-size: 20px; }

  .screen { padding: 20px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== HEADER da tela ===== */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    padding-top: 8px;
  }
  .app-header .left { display: flex; flex-direction: column; gap: 4px; }
  .app-header .day {
    color: var(--text-2);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .app-header .greeting {
    font-family: 'Instrument Serif', serif;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .app-header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .app-header .meta {
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: 1px;
  }

  .avatar-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 15px;
    font-weight: 400;
    overflow: hidden;
    padding: 0;
    color: var(--text);
  }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== TOGGLE (Gi / No-Gi) ===== */
  .toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px;
    margin-bottom: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .toggle button {
    background: transparent;
    color: var(--text-2);
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all 0.15s;
  }
  .toggle button.active { background: var(--text); color: var(--bg); }

  /* Card genérico */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 12px;
  }
  .card-label {
    font-size: 10px;
    color: var(--text-2);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 10px;
  }

  /* Section header (com título serif + link) */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    margin-top: 8px;
  }
  .section-header h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .section-header .link {
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.5px;
  }

  /* Streak hero */
  .streak-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 12px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    width: 100%;
    display: block;
    text-align: left;
  }
  .streak-hero::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 180px; height: 180px;
    background: radial-gradient(circle at top right, var(--primary-soft), transparent 70%);
    pointer-events: none;
  }
  .streak-hero .row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
  }
  .streak-hero .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-2);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .streak-hero .value {
    font-family: 'Instrument Serif', serif;
    font-size: 64px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    font-weight: 400;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .streak-hero .value .unit {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text-2);
    font-weight: 400;
  }
  .streak-hero .value .accent { color: var(--primary); }
  .streak-hero .meta {
    text-align: right;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.5px;
    line-height: 1.6;
  }
  .streak-hero .progress {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .streak-hero .progress .bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }
  .streak-hero .progress .bar .fill {
    height: 100%;
    background: var(--primary);
    border-radius: 100px;
    transition: width 0.3s;
  }
  .streak-hero .progress .frac {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: 0.5px;
  }
  .cta-freeze {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 6px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 11px;
    color: var(--text-2);
    position: relative;
    z-index: 1;
  }

  /* Quick action (Registrar treino) */
  .quick-action {
    background: var(--text);
    color: var(--bg);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    margin-bottom: 28px;
    border: none;
    width: 100%;
    text-align: left;
  }
  .quick-action:active { transform: scale(0.99); }
  .quick-action .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .quick-action .action {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .quick-action .arrow {
    width: 40px; height: 40px;
    background: var(--bg);
    color: var(--text);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  /* Week strip (dots por dia da semana) */
  .week-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 24px;
  }
  .day-dot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 1;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .day-dot .label {
    font-size: 9px;
    color: var(--text-3);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .day-dot .dot {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border-2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-dot.done .dot {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .day-dot.done .dot::after {
    content: '✓';
    font-size: 12px;
    font-weight: 600;
  }
  .day-dot.today .dot { border-color: var(--text); border-width: 2px; }
  .day-dot.today .label { color: var(--text); font-weight: 600; }

  /* Stat list (linha por linha) */
  .stat-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .stat-row {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-row .k .label { font-size: 13px; color: var(--text); }
  .stat-row .k .sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .stat-row .v {
    font-family: 'Instrument Serif', serif;
    font-size: 24px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .stat-row .v .unit {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--text-2);
  }

  /* ===== BUTTONS ===== */
  .btn-primary {
    width: 100%;
    background: var(--primary);
    color: #fff;
    padding: 16px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-2);
    padding: 16px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
  }
  .btn-solid {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    padding: 16px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
  }
  .btn-dashed {
    width: 100%;
    background: transparent;
    color: var(--text-2);
    border: 1px dashed var(--border-2);
    padding: 12px;
    border-radius: 12px;
    font-size: 12px;
  }

  /* ===== INPUTS ===== */
  .input-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .input-row label {
    display: block;
    font-size: 10px;
    color: var(--text-3);
    margin-bottom: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .input-row input, .input-row select, .input-row textarea {
    background: transparent;
    border: none;
    padding: 0;
    font-size: 14px;
    color: var(--text);
    width: 100%;
  }
  .input-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .input-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .form-group { margin-bottom: 22px; }
  .form-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 500;
    margin-bottom: 10px;
    display: block;
  }
  .form-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .chip.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .duration-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .duration-btn {
    flex: 1;
    min-width: 40px;
    padding: 12px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .duration-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* Bottom nav */
  .nav-bottom {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 12px 8px calc(20px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-3);
    font-size: 10px;
    letter-spacing: 0.3px;
    padding: 6px 10px;
  }
  .nav-item.active { color: var(--text); }
  .nav-item i { font-size: 20px; }

  .progress-bar { height: 4px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }

  /* Belt colors */
  .belt-branca { background: #fff; border: 1px solid var(--border-2); }
  .belt-azul { background: #4488ff; }
  .belt-roxa { background: #6644aa; }
  .belt-marrom { background: #8b4513; }
  .belt-preta { background: #000; border: 1px solid #444; }

  .belt-bar { display: flex; gap: 3px; }
  .belt-stripe { height: 6px; flex: 0 0 18px; border-radius: 1px; background: var(--border-2); }

  /* ===== LOGIN (centralizada) ===== */
  .auth-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 28px calc(30px + env(safe-area-inset-bottom));
    position: relative;
  }
  .auth-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .auth-tagline {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--text-2);
    text-align: center;
    letter-spacing: 0.01em;
    margin-top: 14px;
    font-weight: 400;
  }
  .auth-actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .auth-footer {
    margin-top: 16px;
    text-align: center;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 1px;
  }
  /* Formulário (aparece após clicar Entrar/Criar conta) */
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 340px;
    margin-top: 20px;
  }
  .auth-form h2 {
    font-family: 'Instrument Serif', serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    text-align: center;
  }
  .auth-form .subtitle {
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .auth-back {
    background: none;
    color: var(--text-2);
    font-size: 12px;
    padding: 8px;
    margin-top: 6px;
    text-align: center;
    font-weight: 500;
  }
  .error-msg {
    background: var(--red-bg);
    color: var(--red);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12px;
    text-align: center;
    margin-top: 2px;
  }

  /* ===== CALENDAR ===== */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-month {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    color: var(--text-3);
    padding: 6px 0;
    letter-spacing: 1px;
    text-transform: uppercase;
    min-width: 0;
  }
  .cal-day {
    aspect-ratio: 1;
    width: 100%;
    min-width: 0;
    background: transparent;
    border: none;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--text-2);
    position: relative;
    cursor: pointer;
    transition: all 0.15s;
  }
  .cal-day.today {
    border: 1.5px solid var(--text);
    color: var(--text);
    font-weight: 600;
  }
  .cal-day.has-session {
    background: var(--primary);
    color: #fff;
    font-weight: 500;
  }
  .cal-day.has-comp::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    background: var(--amber);
    border-radius: 50%;
  }
  .cal-day.empty { background: transparent; border: none; cursor: default; visibility: hidden; }
  .cal-day.selected { background: var(--text); color: var(--bg); border-color: var(--text); }
  .cal-day.future { opacity: 0.3; cursor: default; }

  /* ===== MODAL (registrar treino) ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;

  /* Recap (Wrapped - inalterado, tema próprio) */
  .recap-overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; background: #000; }
  .recap-slide { width: 100%; max-width: 480px; height: 100vh; max-height: 100vh; padding: 40px 24px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; cursor: pointer; user-select: none; }

  .mig-kicker { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); font-weight: 600; animation: migUp .5s .1s both; }

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { users: {}, currentEmail: null };
    try {
      const db = JSON.parse(raw);
      if (!db || typeof db !== 'object' || !db.users) throw new Error('formato inválido');
      return db;
    } catch (err) {
      // Preserva o blob corrompido antes que uma gravação o sobrescreva
      try { localStorage.setItem(STORAGE_KEY + '_corrupt_' + Date.now(), raw); } catch {}
      console.error('Dados corrompidos, cópia preservada:', err);
      return { users: {}, currentEmail: null };
    }
  } catch { return { users: {}, currentEmail: null }; }
}
// =================== BACKUP ===================
function exportBackup() {
  const payload = { app: 'tatame', version: 1, exportedAt: new Date().toISOString(), data: state.data };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tatame-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('Backup exportado');
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch { showToast('Arquivo inválido', 'error'); return; }
      const data = parsed && parsed.app === 'tatame' ? parsed.data : null;
      if (!data || !data.profile || !Array.isArray(data.sessions) || !Array.isArray(data.comps) || !Array.isArray(data.partners)) {
        showToast('Backup inválido', 'error');
        return;
      }

    const c = JSON.parse(raw);
    if (!c || typeof c !== 'object') throw new Error('formato inválido');
    return c;
  } catch (err) {
    // Preserva o blob corrompido antes que uma gravação o sobrescreva
    if (raw) { try { localStorage.setItem(CACHE_KEY + '_corrupt_' + Date.now(), raw); } catch {} }
    console.error('Cache local corrompido:', err);
    return {};
  }
}
function cacheEntry(userId) { return loadCache()[userId] || null; }
function writeCacheEntry(userId, entry) {

  } catch (err) {
    console.error('Erro ao salvar cache local:', err);
    showToast('Erro ao salvar no aparelho. Verifique o espaço do navegador.', 'error');

}

// Envia os dados atuais para o servidor. Retorna true se ficou sincronizado.
async function syncNow() {
  if (!sb || !state.userId) return false;
  if (syncing) { syncAgain = true; return false; }
  if (!navigator.onLine) { setSyncStatus('offline'); return false; }
  clearTimeout(syncTimer);
  syncing = true;
  setSyncStatus('syncing');
  const rev = localRev;
  const userId = state.userId;
  const email = state.currentUser;
  const snapshot = state.data;
  let ok = false;
  let merged = false;
  try {
    // Outro aparelho gravou depois da última leitura? Então mescla em vez de sobrescrever.
    const meta = await sb.from('user_data').select('updated_at').eq('user_id', userId).maybeSingle();
    if (meta.error) throw meta.error;
    if (meta.data && Date.parse(meta.data.updated_at) !== Date.parse(state.cloudUpdatedAt || 0)) {
      const remote = await fetchCloud(userId);
      if (remote && isValidData(remote.data)) { mergeInto(snapshot, remote.data); merged = true; }
    }
    const updatedAt = new Date().toISOString();
    const { error } = await sb.from('user_data').upsert({ user_id: userId, data: snapshot, updated_at: updatedAt });
    if (error) throw error;
    ok = true;
    if (state.userId === userId) {
      state.cloudUpdatedAt = updatedAt;
      if (merged && !document.querySelector('.modal-overlay')) render();
      if (rev === localRev) {
        writeCacheEntry(userId, { email, data: snapshot, dirty: false, cloudUpdatedAt: updatedAt });
        setSyncStatus('synced');
      } else {
        syncAgain = true; // houve edição durante o envio
      }
    }
  } catch (err) {
    console.error('Erro ao sincronizar:', err);
    setSyncStatus(navigator.onLine ? 'error' : 'offline');
    if (navigator.onLine) { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 30000); }
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(300); }
  }
  return ok;
}

// União por id (o que existe em qualquer um dos lados fica); em conflito no mesmo id, vale o local
function mergeInto(local, remote) {
  ['sessions', 'comps', 'partners'].forEach(k => {
    const have = new Set((local[k] || []).map(x => x.id));
    (remote[k] || []).forEach(x => { if (!have.has(x.id)) local[k].push(x); });
  });
  ['weekPlans', 'recapsDismissed'].forEach(k => {
    local[k] = Object.assign({}, remote[k] || {}, local[k] || {});
  });
  migrate(local);
}

async function migrateToCloud(acc, email, password) {
  if (!sb) return { error: NO_CLOUD_MSG };

  const exists = (error && /already registered/i.test(error.message || '')) ||
    (!error && data.user && data.user.identities && data.user.identities.length === 0);

  let user;

    if (r.error) return { error: 'Este email já tem conta na nuvem com outra senha. Digite a senha dela ou toque em “Já tenho conta na nuvem”.' };
    user = r.data.user;
  } else if (!data.session) {
    setPendingMigration(email, acc.email); // confirmação de email ligada: finaliza no primeiro login
    return { needsConfirm: true, email };
  } else {
    user = data.user;
  }
  const res = await startSession(user);
  if (res.error) return res;
  const counts = legacyCounts(acc.data);
  if (!res.offerLegacy) { // a conta na nuvem já tinha dados: não sobrescreve

  const synced = await flushSync();
  return { ok: true, counts, synced };

// Carrega os dados da conta (cache local + nuvem) depois de autenticar
async function startSession(user, opts = {}) {
  const userId = user.id;

  const name = opts.name || (user.user_metadata && user.user_metadata.name) || '';
  const cached = cacheEntry(userId);
  let cloud = null;
  let cloudOk = true;
  try { cloud = await fetchCloud(userId); } catch (err) { cloudOk = false; console.error('Erro ao buscar dados na nuvem:', err); }

  let data, dirty = false, offerLegacy = false, cloudUpdatedAt = null;
  if (cached && cached.dirty && isValidData(cached.data)) {
    data = cached.data; dirty = true; cloudUpdatedAt = cached.cloudUpdatedAt || null; // alterações locais ainda não enviadas têm prioridade
  } else if (cloud) {
    if (!isValidData(cloud.data)) return { error: 'Os dados da conta na nuvem estão em formato inválido. Contate o suporte' };
    data = cloud.data; cloudUpdatedAt = cloud.updated_at;
    offerLegacy = isEmptyData(data);
  } else if (cached && isValidData(cached.data)) {
    data = cached.data; cloudUpdatedAt = cached.cloudUpdatedAt || null;
    dirty = cloudOk; // nuvem respondeu sem registro: reenvia a cópia do aparelho; sem conexão: só usa a cópia
  } else if (!cloudOk) {
    return { error: 'Sem conexão e sem dados salvos neste aparelho. Conecte-se à internet para carregar sua conta' };
  } else {
    data = newUserData();
    data.profile.name = name || email.split('@')[0];
    dirty = true; offerLegacy = true;
  }
  migrate(data);

  state.userId = userId;
  state.currentUser = email;
  state.data = data;
  state.cloudUpdatedAt = cloudUpdatedAt;
  setLastUser({ id: userId, email });
  writeCacheEntry(userId, { email, data, dirty, cloudUpdatedAt });
  localRev++;
  if (dirty) scheduleSync(0); else setSyncStatus(cloudOk ? 'synced' : 'offline');
  return { ok: true, offerLegacy };
}

function translateAuthError(err) {
  const m = ((err && err.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'Email ou senha incorretos';
  if (m.includes('already registered')) return 'Email já cadastrado';
  if (m.includes('not confirmed')) return 'Confirme seu email pelo link que enviamos antes de entrar';
  if (m.includes('rate limit') || (err && err.status === 429)) return 'Muitas tentativas. Aguarde um pouco';
  if (m.includes('password')) return 'Senha deve ter 6+ caracteres';
  if (m.includes('fetch') || m.includes('network')) return 'Sem conexão. Verifique a internet';
  return 'Não foi possível concluir. Tente novamente';
}

  };

// =================== HELPERS ===================
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function parseLocalISO(iso) {
  // "2026-05-11" → new Date(2026, 4, 11) - local midnight, no UTC shift
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(iso) {
  return parseLocalISO(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}
function fmtDateLong(iso) {
  return parseLocalISO(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
}
function todayISO() { return localISO(new Date()); }
function localISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function initials(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).map(s => s[0]).slice(0,2).join('').toUpperCase();
}

// =================== SISTEMA DE STREAK SEMANAL ===================
// Semana: segunda a domingo. Meta pessoal. Freeze: 2/mês.

// Retorna a data (Date) da segunda-feira da semana que contém a data passada
function mondayOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const dow = d.getDay(); // 0 = domingo, 1 = segunda, ..., 6 = sábado
  const daysToSubtract = dow === 0 ? 6 : dow - 1;
  d.setDate(d.getDate() - daysToSubtract);
  return d;
}

// Chave da semana: "2026-W38" (ISO-ish, segunda a domingo)
function weekKey(date) {
  const monday = mondayOf(date);
  return localISO(monday); // usa a data da segunda como chave
}

// Chave do mês: "2026-09"
function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
}

// Conta treinos registrados na semana que contém a data
function trainingsInWeek(mondayISO) {
  const monday = parseLocalISO(mondayISO);
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  const mondayStr = localISO(monday);
  const sundayStr = localISO(sunday);
  // Contamos dias distintos (não treinos) — treinar 2x no mesmo dia conta como 1
  const days = new Set();
  state.data.sessions.forEach(s => {
    if (s.date >= mondayStr && s.date <= sundayStr) {
      days.add(s.date);
    }
  });
  return days.size;
}

// Se a semana bateu meta OU teve freeze usado
function weekMetGoal(mondayISO, goal) {
  return trainingsInWeek(mondayISO) >= goal;
}

// Retorna quantos freezes já foram usados no mês
function freezesUsedInMonth(monthKeyStr) {
  return (state.data.streakData.freezesUsed[monthKeyStr] || 0);
}

// Máximo de freezes por mês
const MAX_FREEZES_PER_MONTH = 2;
function getMaxFreezesPerMonth() {
  const hasPhoto = !!(state.data && state.data.profile && state.data.profile.photo);
  return MAX_FREEZES_PER_MONTH + (hasPhoto ? 1 : 0);
}

// Calcula streak atual: quantas semanas consecutivas bateu meta (contando freezes)
// A semana ATUAL só conta se já foi fechada OU se já bateu meta
function computeCurrentStreak() {
  const goal = state.data.profile.streakGoal || 3;
  const today = new Date();
  today.setHours(0,0,0,0);
  const currentMonday = mondayOf(today);
  const currentMondayISO = localISO(currentMonday);

  let streak = 0;
  let checkMonday = new Date(currentMonday);

  // Se a semana atual já bateu a meta, começa contando ela
  if (weekMetGoal(currentMondayISO, goal)) {
    streak = 1;
    checkMonday.setDate(checkMonday.getDate() - 7);
  } else {
    // Se a semana atual ainda tá aberta e NÃO bateu meta, ela não quebra o streak ainda
    // Começamos verificando da semana passada
    checkMonday.setDate(checkMonday.getDate() - 7);
  }

  // Volta semana a semana enquanto tiver bateu meta OU tiver freeze
  while (true) {
    const iso = localISO(checkMonday);
    // Não conta semanas anteriores à primeira sessão registrada
    const firstSession = state.data.sessions.length > 0
      ? state.data.sessions.map(s => s.date).sort()[0]
      : null;
    if (firstSession && iso < firstSession && !weekMetGoal(iso, goal)) {
      break; // parou antes de começar a treinar
    }
    if (weekMetGoal(iso, goal)) {
      streak++;
      checkMonday.setDate(checkMonday.getDate() - 7);
      continue;
    }
    // Não bateu meta — tenta freeze
    const mk = monthKey(checkMonday);
    // Verificamos se HÁ freeze marcado nessa semana (usaremos um flag por semana)
    const freezeKey = `freeze_${iso}`;
    if (state.data.streakData.freezesUsed[freezeKey]) {
      streak++;
      checkMonday.setDate(checkMonday.getDate() - 7);
      continue;
    }
    break; // quebrou
  }

  return streak;
}

// Atualiza recorde histórico se o streak atual for maior
function updateStreakRecord() {
  const current = computeCurrentStreak();
  if (current > (state.data.streakData.recordStreak || 0)) {
    state.data.streakData.recordStreak = current;
  }
}

// Aplica um freeze na semana passada (última semana fechada que quebrou o streak)
function useFreezeOnLastWeek() {
  const today = new Date();
  const lastWeekMonday = mondayOf(today);
  lastWeekMonday.setDate(lastWeekMonday.getDate() - 7);
  const iso = localISO(lastWeekMonday);
  const mk = monthKey(lastWeekMonday);
  const goal = state.data.profile.streakGoal || 3;

  if (weekMetGoal(iso, goal)) {
    showToast('Semana passada já bateu meta, não precisa freeze', 'error');
    return false;
  }
  const usedInMonth = freezesUsedInMonth(mk);
  if (usedInMonth >= getMaxFreezesPerMonth()) {
    showToast(`Você já usou ${getMaxFreezesPerMonth()} freezes esse mês`, 'error');
    return false;
  }
  // Verificar se já foi usado nessa semana
  const freezeKey = `freeze_${iso}`;
  if (state.data.streakData.freezesUsed[freezeKey]) {
    showToast('Você já usou freeze nessa semana', 'error');
    return false;
  }
  // Aplica freeze
  state.data.streakData.freezesUsed[freezeKey] = true;
  state.data.streakData.freezesUsed[mk] = (state.data.streakData.freezesUsed[mk] || 0) + 1;
  persistUser();
  updateStreakRecord();
  showToast('Freeze usado! Streak protegido 🧊');
  return true;
}

// Estado da semana atual: quantos treinos, quantos faltam, etc
function currentWeekStatus() {
  const goal = state.data.profile.streakGoal || 3;
  const today = new Date();
  const currentMonday = mondayOf(today);
  const currentMondayISO = localISO(currentMonday);
  const done = trainingsInWeek(currentMondayISO);
  const remaining = Math.max(0, goal - done);
  const metGoal = done >= goal;

  // Dias restantes na semana (incluindo hoje)
  const sunday = new Date(currentMonday);
  sunday.setDate(sunday.getDate() + 6);
  const daysLeft = Math.ceil((sunday - today) / (1000 * 60 * 60 * 24)) + 1;

  return { goal, done, remaining, metGoal, daysLeft };
}

function getSessionsForMode() { return state.data.sessions.filter(s => s.mode === state.mode); }
function getCompsForMode() { return state.data.comps.filter(c => c.mode === state.mode); }

function getMonthStats(year, month) {
  const sessions = getSessionsForMode().filter(s => {
    const d = parseLocalISO(s.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });
  let rolls = 0, applied = 0, suffered = 0, minutes = 0;
  sessions.forEach(s => {
    rolls += s.rolls || 0;
    applied += (s.applied || []).length;
    suffered += (s.suffered || []).length;
    minutes += s.duration || 0;
  });
  return { sessionsCount: sessions.length, rolls, applied, suffered, hours: Math.round(minutes/60*10)/10 };
}

function getWeekKey(date) {
  // ISO week key: YYYY-Www
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = d.valueOf();
  d.setUTCMonth(0, 1);
  if (d.getUTCDay() !== 4) {
    d.setUTCMonth(0, 1 + ((4 - d.getUTCDay()) + 7) % 7);
  }
  const weekNum = 1 + Math.ceil((firstThursday - d) / 604800000);
  return `${date.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;
}

function getCurrentWeekProgress() {
  const now = new Date();
  const day = now.getDay();
  const offset = day === 0 ? 6 : day - 1;
  const monday = new Date(now); monday.setDate(now.getDate() - offset); monday.setHours(0,0,0,0);
  const days = [];
  for (let i=0; i<7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    days.push(d);
  }
  const sessions = state.data.sessions.filter(s => s.mode === state.mode);
  const sessionsByDay = days.map(d => {
    const iso = localISO(d);
    return sessions.some(s => s.date === iso);
  });
  const weekKey = getWeekKey(now);
  if (!state.data.weekPlans) state.data.weekPlans = {};
  if (!state.data.weekPlans[weekKey]) state.data.weekPlans[weekKey] = { gi: [false,false,false,false,false,false,false], 'no-gi': [false,false,false,false,false,false,false] };
  if (Array.isArray(state.data.weekPlans[weekKey])) {
    state.data.weekPlans[weekKey] = { gi: state.data.weekPlans[weekKey].slice(), 'no-gi': [false,false,false,false,false,false,false] };
  }
  const plan = state.data.weekPlans[weekKey][state.mode];
  // Total marked = days that are either planned OR trained (union)
  const markedDays = plan.map((p, i) => p || sessionsByDay[i]);
  const goal = markedDays.filter(Boolean).length;
  const done = sessionsByDay.filter(Boolean).length;
  return { days, sessionsByDay, plan, weekKey, done, goal, now };
}

function computeStats(periodDays = 90) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - periodDays);
  const sessions = getSessionsForMode().filter(s => parseLocalISO(s.date) >= cutoff);
  const positionCount = {}, subCount = {}, comboCount = {}, sufferedCombos = {};
  let totalApplied = 0, totalSuffered = 0;
  sessions.forEach(s => {
    (s.applied || []).forEach(a => {
      totalApplied++;
      if (a.position) positionCount[a.position] = (positionCount[a.position] || 0) + 1;
      if (a.submission) subCount[a.submission] = (subCount[a.submission] || 0) + 1;
      if (a.position && a.submission) {
        const k = `${a.position} → ${a.submission}`;
        comboCount[k] = (comboCount[k] || 0) + 1;
      }
    });
    (s.suffered || []).forEach(x => {
      totalSuffered++;
      if (x.position && x.submission) {
        const k = `${x.position} → ${x.submission}`;
        sufferedCombos[k] = (sufferedCombos[k] || 0) + 1;
      }
    });
  });
  function topN(obj, n=5) {
    return Object.entries(obj).sort((a,b) => b[1] - a[1]).slice(0, n);
  }
  return { totalApplied, totalSuffered, positions: topN(positionCount), subs: topN(subCount), combos: topN(comboCount, 5), suffered: topN(sufferedCombos, 5) };
}

function computeMonthlyRecap(year, month) {
  // Considera ambos modos (Gi + No-Gi) - retrospectiva é do atleta no mês inteiro
  const allSessions = state.data.sessions.filter(s => {
    const d = parseLocalISO(s.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });
  const allComps = state.data.comps.filter(c => {
    const d = parseLocalISO(c.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });

  // Mês anterior para comparações
  const prevMonth = month === 0 ? 11 : month - 1;
  const prevYear = month === 0 ? year - 1 : year;
  const prevSessions = state.data.sessions.filter(s => {
    const d = parseLocalISO(s.date);
    return d.getFullYear() === prevYear && d.getMonth() === prevMonth;
  });

  let rolls = 0, applied = 0, suffered = 0, minutes = 0;
  const positionCount = {}, subCount = {}, comboCount = {}, sufferedCombos = {}, partnerCount = {};
  const moodValues = [];
  const trainingDays = new Set();
  const giCount = { gi: 0, 'no-gi': 0 };

  allSessions.forEach(s => {
    rolls += s.rolls || 0;
    applied += (s.applied || []).length;
    suffered += (s.suffered || []).length;
    minutes += s.duration || 0;
    trainingDays.add(s.date);
    giCount[s.mode] = (giCount[s.mode] || 0) + 1;
    if (s.mood != null) moodValues.push(s.mood);
    (s.applied || []).forEach(a => {
      if (a.position) positionCount[a.position] = (positionCount[a.position] || 0) + 1;
      if (a.submission) subCount[a.submission] = (subCount[a.submission] || 0) + 1;
      if (a.position && a.submission) {
        const k = `${a.position} → ${a.submission}`;
        comboCount[k] = (comboCount[k] || 0) + 1;
      }
    });
    (s.suffered || []).forEach(x => {
      if (x.position && x.submission) {
        const k = `${x.position} → ${x.submission}`;
        sufferedCombos[k] = (sufferedCombos[k] || 0) + 1;
      }
    });
    (s.partners || []).forEach(pid => {
      partnerCount[pid] = (partnerCount[pid] || 0) + 1;
    });
  });

  let prevRolls = 0, prevMinutes = 0, prevApplied = 0;
  prevSessions.forEach(s => {
    prevRolls += s.rolls || 0;
    prevMinutes += s.duration || 0;
    prevApplied += (s.applied || []).length;
  });

  const topByCount = (obj) => {
    const sorted = Object.entries(obj).sort((a,b) => b[1] - a[1]);
    return sorted[0] || null;
  };
  const topPosition = topByCount(positionCount);
  const topSub = topByCount(subCount);
  const topCombo = topByCount(comboCount);
  const topVulnerability = topByCount(sufferedCombos);
  const topPartnerEntry = topByCount(partnerCount);
  const topPartner = topPartnerEntry ? state.data.partners.find(p => p.id === topPartnerEntry[0]) : null;

  const avgMood = moodValues.length ? (moodValues.reduce((a,b) => a+b, 0) / moodValues.length) : null;

  // Streak: max consecutive days with training
  const sortedDays = Array.from(trainingDays).sort();
  let maxStreak = 0, currentStreak = 0, lastDate = null;
  for (const isoDate of sortedDays) {
    const d = parseLocalISO(isoDate);
    if (lastDate && (d - lastDate) === 86400000) {
      currentStreak++;
    } else {
      currentStreak = 1;
    }
    maxStreak = Math.max(maxStreak, currentStreak);
    lastDate = d;
  }

  const monthName = new Date(year, month, 1).toLocaleDateString('pt-BR', { month: 'long' });
  const totalAppliedPlusSuffered = applied + suffered;

  return {
    year, month, monthName,
    sessions: allSessions.length,
    comps: allComps.length,
    rolls, applied, suffered, minutes,
    hours: Math.round(minutes/60*10)/10,
    trainingDays: trainingDays.size,
    giCount: giCount.gi, nogiCount: giCount['no-gi'],
    avgMood,
    moodCount: moodValues.length,
    topPosition, topSub, topCombo, topVulnerability, topPartner,
    partnerCount: Object.keys(partnerCount).length,
    maxStreak,
    submissionRate: totalAppliedPlusSuffered > 0 ? Math.round(applied / totalAppliedPlusSuffered * 100) : 0,
    // Comparisons with previous month
    prev: { rolls: prevRolls, hours: Math.round(prevMinutes/60*10)/10, applied: prevApplied, sessions: prevSessions.length },
    hasData: allSessions.length > 0,
  };
}

function getAvailableRecaps() {
  // Returns list of {year, month} pairs that have at least 1 session and are in the past (fully completed months)
  const today = new Date();
  today.setDate(1); today.setHours(0,0,0,0);
  const months = new Set();
  state.data.sessions.forEach(s => {
    const d = parseLocalISO(s.date);
    if (d < today) {
      months.add(`${d.getFullYear()}-${d.getMonth()}`);
    }
  });
  return Array.from(months).map(k => {
    const [y, m] = k.split('-').map(Number);
    return { year: y, month: m };
  }).sort((a, b) => (b.year - a.year) || (b.month - a.month));
}

function getCurrentUnseenRecap() {
  // Returns the latest unseen recap key, or null
  const recaps = getAvailableRecaps();
  for (const r of recaps) {
    const key = `${r.year}-${String(r.month + 1).padStart(2, '0')}`;
    if (!state.data.recapsDismissed || !state.data.recapsDismissed[key]) {
      return r;
    }
  }
  return null;
}

  } else {

      body = `<div class="mig-kicker">Quase lá</div>
        <h1 class="mig-title">Confirme seu <em>email</em></h1>
        <p class="mig-text">Enviamos um link para ${escapeHtml(r.email)}. Depois de confirmar, é só entrar: seus dados serão enviados automaticamente.</p>`;
      actions = `<button class="btn-primary" id="mig-login">Ir para o login</button>`;
    } else {
      const n = r.counts || { sessions: 0, comps: 0, partners: 0 };
      body = `<div class="mig-ok"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path class="mig-check" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>

        <h1 class="mig-title">Tudo na <em>nuvem</em></h1>
        <p class="mig-text">${r.kept ? 'Sua conta na nuvem já tinha dados, então mantivemos os dela. Os dados deste aparelho continuam guardados aqui.'
          : `${plural(n.sessions, 'treino', 'treinos')}, ${plural(n.comps, 'campeonato', 'campeonatos')} e ${plural(n.partners, 'parceiro', 'parceiros')} agora estão seguros. ${r.synced ? '' : 'Eles serão enviados assim que a conexão voltar.'}`}</p>`;
      actions = `<button class="btn-primary" id="mig-start">Começar</button>`;
    }
  }
  return `<div class="mig" id="mig">${top}<div class="mig-stage"><div class="${cls}">${body}</div></div><div class="mig-actions">${actions}</div></div>`;
}

function setMigError(msg) {
  const el = document.getElementById('mig-error');
  if (!el) return;
  el.textContent = msg || '';
  el.hidden = !msg;
}
function setMigBusy(busy) {
  const b = document.getElementById('mig-submit');
  if (!b) return;
  b.disabled = busy;
  b.textContent = busy ? 'Enviando…' : 'Exportar dados para a nuvem';
}
function migGo(step) {
  migState.dir = step >= migState.step ? 1 : -1;
  migState.step = Math.max(0, Math.min(MIG_FORM_STEP, step));
  render();
}

async function submitMigration() {
  const m = migState;
  if (!m || m.busy) return;
  const email = document.getElementById('mig-email').value.trim().toLowerCase();
  const pw = document.getElementById('mig-pw').value;
  if (!email.includes('@')) { setMigError('Informe um email válido'); return; }
  if (pw.length < 6) { setMigError('Crie uma senha com 6+ caracteres'); return; }
  setMigError('');
  m.busy = true;
  setMigBusy(true);
  let res;
  try { res = await migrateToCloud(migAccount(), email, pw); }
  catch (err) { console.error('Erro na migração:', err); res = { error: translateAuthError(err) }; }
  m.busy = false;
  if (res.error) { setMigBusy(false); setMigError(res.error); return; }
  m.result = res;
  m.dir = 1;
  m.step = MIG_FORM_STEP + 1;
  render();
}

function animateCounters() {
  const els = document.querySelectorAll('.mig-stats [data-count]');
  els.forEach(el => {
    const target = parseInt(el.dataset.count) || 0;
    if (!target || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = target; return; }
    const t0 = performance.now(), dur = 1100;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1 && document.body.contains(el)) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function attachMigrationListeners() {
  const m = migState;
  const $ = id => document.getElementById(id);
  if ($('mig-next')) $('mig-next').onclick = () => migGo(m.step + 1);
  if ($('mig-skip')) $('mig-skip').onclick = () => closeMigration('landing');
  if ($('mig-submit')) $('mig-submit').onclick = submitMigration;
  if ($('mig-existing')) $('mig-existing').onclick = () => { authEmail = $('mig-email').value.trim().toLowerCase(); closeMigration('login'); };
  if ($('mig-login')) $('mig-login').onclick = () => {
    authEmail = (m.result && m.result.email) || '';
    authInfo = 'Confirme seu email e depois entre. Seus dados serão enviados automaticamente.';
    closeMigration('login');
  };
  if ($('mig-start')) $('mig-start').onclick = () => { migState = null; state.currentTab = 'home'; render(); };
  if ($('mig-account')) $('mig-account').onchange = e => { m.selected = e.target.value; $('mig-email').value = m.selected; };
  ['mig-email', 'mig-pw'].forEach(id => {
    if ($(id)) $(id).addEventListener('keydown', e => { if (e.key === 'Enter') submitMigration(); });
  });
  if (m.step === MIG_LAST_INFO_STEP) animateCounters();
  // Deslizar para avançar/voltar
  const root = $('mig');
  let x0 = null;
  root.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  root.addEventListener('touchend', e => {
    if (x0 === null || m.step > MIG_FORM_STEP) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) < 60) return;
    if (dx < 0 && m.step < MIG_FORM_STEP) migGo(m.step + 1);
    else if (dx > 0 && m.step > 0) migGo(m.step - 1);
  }, { passive: true });
}

function attachAuthListeners() {
  const goLogin = document.getElementById('auth-go-login');

  if (goLogin) goLogin.onclick = () => { authMode = 'login'; authError = ''; authInfo = ''; authEmail = ''; authName = ''; render(); };
  if (goRegister) goRegister.onclick = () => { authMode = 'register'; authError = ''; authInfo = ''; authEmail = ''; authName = ''; render(); };
  if (back) back.onclick = () => { authMode = 'landing'; authError = ''; authInfo = ''; render(); };
  const migrateBtn = document.getElementById('auth-migrate');
  if (migrateBtn) migrateBtn.onclick = () => { if (startMigration(MIG_FORM_STEP)) render(); };
  const forgot = document.getElementById('auth-forgot');
  if (forgot) forgot.onclick = async () => {
    const email = document.getElementById('auth-email').value.trim().toLowerCase();
    authEmail = email;
    if (!email.includes('@')) { authError = 'Digite seu email acima para receber o link'; authInfo = ''; render(); return; }
    if (!sb) { authError = NO_CLOUD_MSG; authInfo = ''; render(); return; }
    forgot.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if (error) { authError = translateAuthError(error); authInfo = ''; }
    else { authError = ''; authInfo = 'Se existir uma conta com esse email, enviamos um link para redefinir a senha.'; }
    render();
  };
  const submit = document.getElementById('auth-submit');
  if (submit) submit.onclick = async () => {
    if (authMode === 'recovery') {
      const pw1 = document.getElementById('auth-pw').value;
      submit.disabled = true;
      let r;
      try { r = await tryUpdatePassword(pw1); } catch (err) { r = { error: translateAuthError(err) }; }
      if (r.error) { authError = r.error; render(); return; }
      authError = ''; authMode = 'landing'; state.currentTab = 'home';
      render();
      afterLogin(r);
      return;
    }
    const email = document.getElementById('auth-email').value.trim().toLowerCase();
    const pw = document.getElementById('auth-pw').value;
    authEmail = email;
    authName = authMode === 'register' ? document.getElementById('auth-name').value.trim() : '';
    if (!email || !pw) { authError = 'Preencha email e senha'; authInfo = ''; render(); return; }
    submit.disabled = true;
    submit.textContent = 'Aguarde…';
    let res;
    try {
      if (authMode === 'login') {
        res = await tryLogin(email, pw);
      } else {
        const name = document.getElementById('auth-name').value.trim();
        res = await tryRegister(email, pw, name);
      }
    } catch (err) {
      console.error('Erro de autenticação:', err);
      res = { error: translateAuthError(err) };
    }
    if (res.error) { authError = res.error; authInfo = ''; render(); }
    else if (res.needsConfirm) {
      authError = '';
      authInfo = 'Enviamos um link de confirmação para ' + email + '. Confirme e depois entre.';
      authMode = 'login'; authName = '';
      render();
    } else {
      authError = ''; authInfo = ''; authEmail = ''; authName = ''; authMode = 'landing'; state.currentTab = 'home';
      render();
      afterLogin(res);
    }
  };
  // Enter submit
  ['auth-email','auth-pw','auth-name'].forEach(id => {
    const el = document.getElementById(id);
    if (el && submit) el.addEventListener('keydown', e => { if (e.key === 'Enter') submit.click(); });
  });
}

function renderCalendar() {
  const { year, month } = state.cal;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const sessions = getSessionsForMode();
  const compsList = getCompsForMode();
  const sessionDates = new Set(sessions.map(s => s.date));
  const compDates = new Set(compsList.map(c => c.date));
  const today = new Date(); today.setHours(0,0,0,0);

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(year, month, d);
    const iso = localISO(date);
    const isToday = date.getTime() === today.getTime();
    const isFuture = date > today;
    const hasSession = sessionDates.has(iso);
    const hasComp = compDates.has(iso);
    let cls = 'cal-day';
    if (hasSession) cls += ' has-session';
    if (hasComp) cls += ' has-comp';
    if (isToday) cls += ' today';
    if (isFuture && !hasSession && !hasComp) cls += ' future';
    cells += `<button class="${cls}" data-action="select-day:${iso}">${d}</button>`;
  }

  const monthName = firstDay.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const monthCap = monthName.charAt(0).toUpperCase() + monthName.slice(1);
  const m = getMonthStats(year, month);

  // Melhor semana do mês
  let bestWeek = 0;
  const weekCounts = {};
  sessions.filter(s => {
    const d = parseLocalISO(s.date);
    return d.getFullYear() === year && d.getMonth() === month;
  }).forEach(s => {
    const wk = weekKey(parseLocalISO(s.date));
    weekCounts[wk] = (weekCounts[wk] || 0) + 1;
  });
  Object.values(weekCounts).forEach(v => { if (v > bestWeek) bestWeek = v; });

  return `
  <div class="screen">
    <div class="app-header">
      <div class="left">
        <span class="day">${monthCap}</span>
        <h1>Histórico</h1>
      </div>
      <div class="cal-nav">
        <button data-action="cal:prev">${icon('chevron-left', 16)}</button>
        <button data-action="cal:next">${icon('chevron-right', 16)}</button>
      </div>
    </div>

    <div style="margin-bottom:16px">
      <div class="toggle" style="margin-bottom:0">
        <button class="${state.mode === 'gi' ? 'active' : ''}" data-action="mode:gi">Gi</button>
        <button class="${state.mode === 'no-gi' ? 'active' : ''}" data-action="mode:no-gi">No-Gi</button>
      </div>
    </div>

    <div class="cal-grid" style="margin-bottom:6px">
      <div class="cal-dow">S</div>
      <div class="cal-dow">T</div>
      <div class="cal-dow">Q</div>
      <div class="cal-dow">Q</div>
      <div class="cal-dow">S</div>
      <div class="cal-dow">S</div>
      <div class="cal-dow">D</div>
    </div>
    <div class="cal-grid" style="margin-bottom:24px">${cells}</div>

    <div class="stat-list">
      <div class="stat-row">
        <div class="k">
          <div class="label">Treinos no mês</div>
          <div class="sub">${m.hours}h no total</div>
        </div>
        <div class="v">${m.sessionsCount}</div>
      </div>
      <div class="stat-row">

// ---------- DAY DETAIL ----------
function renderDay() {
  const date = state.selectedDate;
  const sessions = getSessionsForMode().filter(s => s.date === date);
  const comps = getCompsForMode().filter(c => c.date === date);

  let body = '';
  if (sessions.length === 0 && comps.length === 0) {
    body = `<div class="empty">${icon('calendar-off', 16)}<p>Sem atividades neste dia</p></div>`;
  } else {
    sessions.forEach(s => {
      body += renderSessionCard(s);
    });
    comps.forEach(c => {
      body += renderCompCard(c);
    });
  }

  const isFutureDate = date > todayISO();
  return `
  <div class="screen">
    <div class="day-header">
      <button class="back" data-action="goto:calendar">${icon('arrow-left', 18)}</button>
      <h2>${(() => { const s = fmtDateLong(date); return s.charAt(0).toUpperCase() + s.slice(1); })()}</h2>
      <div style="width:32px"></div>
    </div>
    ${body}
    ${isFutureDate
      ? `<div class="empty" style="padding:20px;margin-top:16px">${icon('lock', 16)}<p>Datas futuras não podem ter treinos registrados</p></div>`
      : `<button class="btn-primary" style="margin-top:16px" data-action="open:new-session-date:${date}"><span style="vertical-align:-2px">${icon('plus', 16)}</span> Adicionar treino neste dia</button>`}

// ---------- STATS ----------
let statsPeriod = 90;
let statsChart = 'bar'; // 'bar' | 'pie'

const PIE_COLORS = ['#ff4444','#ffaa33','#6ee06e','#4488ff','#aa66ff','#ff8866','#66c2c2','#ff66a3','#88cc44','#cc88ff'];

function renderPie(entries, total, opts = {}) {
  // entries: [[name, count], ...]
  if (!entries.length || !total) return '';
  const size = opts.size || 200;
  const cx = size/2, cy = size/2, r = size/2 - 10, innerR = opts.innerR || 0;
  let angle = -Math.PI/2; // start at top
  const slices = entries.map(([name, count], i) => {
    const frac = count / total;
    const a2 = angle + frac * Math.PI * 2;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    let path;
    if (entries.length === 1 || frac >= 0.9999) {
      // Full circle - draw as two semicircles to avoid degenerate arc
      path = `M ${cx-r},${cy} A ${r},${r} 0 1 1 ${cx+r},${cy} A ${r},${r} 0 1 1 ${cx-r},${cy} Z`;
    } else if (frac >= 0.5) {
      // Large slice - split into 2 arcs to avoid SVG quirks at exactly 50%
      const mid = angle + Math.PI * frac / 2;
      const xm = cx + r * Math.cos(mid), ym = cy + r * Math.sin(mid);
      path = `M ${cx},${cy} L ${x1},${y1} A ${r},${r} 0 0 1 ${xm},${ym} A ${r},${r} 0 0 1 ${x2},${y2} Z`;
    } else {
      path = `M ${cx},${cy} L ${x1},${y1} A ${r},${r} 0 0 1 ${x2},${y2} Z`;
    }
    const color = PIE_COLORS[i % PIE_COLORS.length];
    // label position
    const labelAngle = angle + frac * Math.PI;
    const lx = cx + (r * 0.6) * Math.cos(labelAngle);
    const ly = cy + (r * 0.6) * Math.sin(labelAngle);
    const result = { path, color, name, count, frac, lx, ly };
    angle = a2;
    return result;
  });

  return `<div style="display:flex;flex-direction:column;align-items:center">
    <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%;height:auto">
      ${slices.map(sl => `<path d="${sl.path}" fill="${sl.color}" stroke="var(--bg)" stroke-width="2"></path>`).join('')}
      ${innerR > 0 ? `<circle cx="${cx}" cy="${cy}" r="${innerR}" fill="var(--surface)"/>` : ''}
      ${slices.filter(sl => sl.frac > 0.06).map(sl => `<text x="${sl.lx}" y="${sl.ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="11" font-weight="600" font-family="Inter">${Math.round(sl.frac * 100)}%</text>`).join('')}
    </svg>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:14px;width:100%">
      ${slices.map(sl => `<div style="display:flex;align-items:center;gap:8px;font-size:12px">
        <div style="width:10px;height:10px;border-radius:2px;background:${sl.color};flex-shrink:0"></div>
        <span style="flex:1;color:var(--text)">${escapeHtml(sl.name)}</span>
        <span style="color:var(--text-2)">${sl.count} · ${Math.round(sl.frac * 100)}%</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderBars(entries, total) {
  return entries.map(([name, c]) => {
    const pct = total ? Math.round(c / total * 100) : 0;
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:13px">${escapeHtml(name)}</span>
        <span style="font-size:13px;font-weight:500">${c} · <span style="color:var(--primary)">${pct}%</span></span>
      </div>
      <div class="progress-track"><div class="fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function renderStats() {
  const s = computeStats(statsPeriod);
  const periodLabel = { 7: '7 dias', 30: '30 dias', 90: '90 dias', 9999: 'Tudo' };

  // Bars renderer minimalista
  function renderBarsClean(entries, total) {
    if (!entries.length) return `<div style="text-align:center;color:var(--text-3);padding:24px 8px;font-size:12px">
      <div>Sem dados no período</div>
    </div>`;
    const maxVal = Math.max(...entries.map(([_, c]) => c));
    return `<div class="bars-row">
      ${entries.slice(0, 6).map(([name, c]) => {
        const pct = maxVal > 0 ? (c / maxVal * 100) : 0;
        const shareStr = total > 0 ? Math.round(c / total * 100) + '%' : '';
        return `<div class="bar-item">
          <div class="top"><span class="name">${escapeHtml(name)}</span><span class="num">${c}${shareStr ? ' · ' + shareStr : ''}</span></div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // Comparar com período anterior (só pra 30d)
  let comparisonNote = '';
  if (statsPeriod === 30) {
    const prevStats = computePriorPeriodStats(30);
    if (prevStats && prevStats.totalApplied > 0) {
      const diff = s.totalApplied - prevStats.totalApplied;
      if (diff !== 0) {
        comparisonNote = `${diff > 0 ? '+' : ''}${diff} vs mês anterior`;
      }
    }
  }

  return `
  <div class="screen">
    <div class="app-header">
      <div class="left">
        <span class="day">${periodLabel[statsPeriod] || '30 dias'}</span>
        <h1>Stats</h1>
      </div>
      ${headerAvatar()}
    </div>

    <div style="margin-bottom:16px">
      <div class="toggle" style="margin-bottom:0">
        <button class="${state.mode === 'gi' ? 'active' : ''}" data-action="mode:gi">Gi</button>
        <button class="${state.mode === 'no-gi' ? 'active' : ''}" data-action="mode:no-gi">No-Gi</button>
      </div>
    </div>

    <div class="stats-toggle">
      ${[7,30,90,9999].map(d => `<button class="${statsPeriod === d ? 'active' : ''}" data-action="period:${d}">${periodLabel[d]}</button>`).join('')}
    </div>

    <div class="hero-metric">
      <div class="label">Total de finalizações</div>
      <div class="value"><span class="accent">${s.totalApplied}</span> <span class="unit">aplicadas</span></div>
      ${comparisonNote ? `<div class="sub">${comparisonNote}</div>` : ''}
    </div>

    <div class="chart-block">
      <div class="title">Suas finalizações</div>
      <div class="subtitle">De onde vêm · ${state.mode === 'gi' ? 'Gi' : 'No-Gi'}</div>
      ${renderBarsClean(s.subs, s.totalApplied)}
    </div>

    <div class="chart-block">
      <div class="title">Vulnerabilidades</div>
      <div class="subtitle">Onde você cai · ${state.mode === 'gi' ? 'Gi' : 'No-Gi'}</div>
      ${renderBarsClean(s.suffered, s.suffered.reduce((sum, [_,c]) => sum+c, 0))}
    </div>

    ${s.combos && s.combos.length > 0 ? `<div class="chart-block">
      <div class="title">Combos frequentes</div>
      <div class="subtitle">Posição → finalização</div>
      ${s.combos.slice(0, 5).map(([k, c]) => {
        const [pos, sub] = k.split(' → ');
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
          <div>
            <span style="font-size:12px;color:var(--text-2)">${escapeHtml(pos)}</span>
            <span style="color:var(--text-3);margin:0 6px">→</span>
            <span style="font-size:13px;color:var(--text)">${escapeHtml(sub)}</span>
          </div>
          <span class="mono" style="font-size:11px;color:var(--text-2)">${c}×</span>
        </div>`;
      }).join('')}
    </div>` : ''}
  </div>`;
}

function computePriorPeriodStats(days) {
  const now = new Date();
  const start = new Date(now); start.setDate(start.getDate() - days*2);
  const end = new Date(now); end.setDate(end.getDate() - days);
  const sessions = getSessionsForMode().filter(s => {
    const d = parseLocalISO(s.date);
    return d >= start && d < end;
  });
  let totalApplied = 0;
  sessions.forEach(s => { totalApplied += (s.applied || []).length; });
  return { totalApplied };
}

// =================== EVENT HANDLING ===================
function attachListeners() {
  // No-op: we use event delegation globally (see initDelegation below)
}

// Global event delegation - registered once. Survives re-renders.
let _delegationInited = false;
function initDelegation() {
  if (_delegationInited) return;
  _delegationInited = true;
  // Use bubble phase (default) - more reliable across browsers (especially Safari)
  document.addEventListener('click', (e) => {
    // Action handler
    const actionTarget = e.target.closest('[data-action]');
    if (actionTarget) {
      e.stopPropagation();
      handleAction(actionTarget.dataset.action);
      return;
    }
    // Modal action handler (skip inputs/textareas/selects which use other listeners)
    const mactTarget = e.target.closest('[data-mact]');
    if (mactTarget) {
      const tag = mactTarget.tagName;
      if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.stopPropagation();
      handleModalAction(mactTarget.dataset.mact, mactTarget.value);
    }
  });
  // Select changes (for modal dropdowns)
  document.addEventListener('change', (e) => {
    const target = e.target.closest('[data-mact]');
    if (target && target.tagName === 'SELECT') {
      handleModalAction(target.dataset.mact, target.value);
    }
  });
}

function attachModalListeners() {
  // No-op for action wiring (delegation handles it).
  // But still wire the raw textarea / file input handlers needed inline.
}

function handleAction(a) {
  const [cmd, ...rest] = a.split(':');
  const arg = rest.join(':');
  switch (cmd) {
    case 'tab': state.currentTab = arg; render(); break;
    case 'goto': state.currentTab = arg; render(); break;
    case 'mode': state.mode = arg; render(); break;
    case 'period': statsPeriod = parseInt(arg); render(); break;
    case 'chart': statsChart = arg; render(); break;
    case 'recap-open':
      const [ry, rm] = arg.split('-').map(Number);
      openRecap(ry, rm);
      break;
    case 'recap-close': closeRecap(); break;
    case 'recap-next': nextRecapSlide(); break;
    case 'recap-prev': prevRecapSlide(); break;
    case 'use-freeze':
      openConfirmModal('Usar freeze', 'Proteger seu streak da semana passada?', 'Usar freeze', () => {
        useFreezeOnLastWeek();
        render();
      });
      break;
    case 'set-theme':
      state.data.profile.theme = arg;
      persistUser();
      render();
      showToast(arg === 'dark' ? 'Modo escuro' : 'Modo claro');
      break;
    case 'cal':
      if (arg === 'prev') {
        state.cal.month--;
        if (state.cal.month < 0) { state.cal.month = 11; state.cal.year--; }
      } else if (arg === 'next') {
        state.cal.month++;
        if (state.cal.month > 11) { state.cal.month = 0; state.cal.year++; }
      }
      render(); break;
    case 'select-day':
      state.selectedDate = arg;
      state.currentTab = 'day';
      render();
      break;
    case 'open':
      handleOpen(arg);
      break;
    case 'logout':
      openConfirmModal('Sair da conta?', 'Você vai precisar entrar de novo.', 'Sair', () => {
        logout();
      });
      break;
    case 'sync-now':
      if (!sb) showToast(NO_CLOUD_MSG, 'error');
      else syncNow().then(ok => { if (ok) showToast('Sincronizado'); });
      break;
    case 'export-data': exportBackup(); break;
    case 'import-data': importBackup(); break;
    case 'notify-interest':
      showToast('Obrigado! Vamos avisar quando estiver pronto.');
      break;
    case 'del-session':
      openConfirmModal('Deletar treino', 'Esta ação não pode ser desfeita.', 'Deletar', () => { state.data.sessions = state.data.sessions.filter(s => s.id !== arg); persistUser(); render(); showToast('Treino deletado'); });
      break;
    case 'edit-session':
      openEditSessionModal(arg);
      break;
    case 'del-comp':
      openConfirmModal('Deletar competição', 'Esta ação não pode ser desfeita.', 'Deletar', () => { state.data.comps = state.data.comps.filter(c => c.id !== arg); persistUser(); render(); showToast('Competição deletada'); });
      break;
    case 'del-partner':
      openConfirmModal('Deletar parceiro', 'Os registros existentes vão manter a referência.', 'Deletar', () => {
        state.data.partners = state.data.partners.filter(p => p.id !== arg);
        persistUser(); render(); showToast('Parceiro removido');
      });
      break;
    case 'edit-partner':
      openEditPartnerModal(arg);
      break;
    case 'view-comp':
      const comp = state.data.comps.find(c => c.id === arg);
      if (comp) { state.selectedDate = comp.date; state.currentTab = 'day'; render(); }
      break;
    case 'toggle-plan':
      const idx = parseInt(arg);
      const wk = getCurrentWeekProgress();
      // getCurrentWeekProgress already migrates/initializes the structure
      state.data.weekPlans[wk.weekKey][state.mode][idx] = !state.data.weekPlans[wk.weekKey][state.mode][idx];
      persistUser(); render();
      break;
  }
}

function handleOpen(arg) {
  const [type, param] = arg.split('-date:');
  if (arg === 'new-session' || type === 'new-session') openSessionModal(param || todayISO());
  else if (arg === 'new-comp') openCompModal();
