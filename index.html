];

let recapState = { active: false, year: 0, month: 0, slideIdx: 0, slides: [] };

function buildRecapSlides(recap) {
  const slides = [];
  const monthCap = recap.monthName.charAt(0).toUpperCase() + recap.monthName.slice(1);

  // Slide 1: Capa
  slides.push({
    title: `Sua jornada em ${monthCap}`,
    render: () => `
      <div class="recap-content">
        <div class="recap-emoji">🥋</div>
        <div class="recap-label">Retrospectiva</div>
        <div class="recap-big" style="font-size:56px">${monthCap.toUpperCase()}</div>
        <div class="recap-big-sub" style="font-size:32px;font-family:'Instrument Serif';letter-spacing:0.04em">${recap.year}</div>
        <div class="recap-body" style="margin-top:24px">Bora ver como foi seu mês no tatame?</div>
      </div>`
  });

  // Slide 2: Volume — treinos
  const prevDiff = recap.sessions - recap.prev.sessions;
  const sessionMsg = recap.prev.sessions === 0
    ? `Bora manter o ritmo no próximo!`
    : prevDiff > 0
      ? `${prevDiff} ${prevDiff === 1 ? 'treino a mais' : 'treinos a mais'} que ${recap.prev.sessions === 1 ? 'o mês passado' : 'em ' + recap.prev.sessions}!`
      : prevDiff < 0
        ? `${Math.abs(prevDiff)} ${Math.abs(prevDiff) === 1 ? 'a menos' : 'a menos'} que o mês passado.`
        : `Mantendo o ritmo do mês passado.`;
  slides.push({
    title: 'Volume',
    render: () => `
      <div class="recap-content">
        <div class="recap-emoji">🔥</div>
        <div class="recap-label">Você apareceu no tatame</div>
        <div class="recap-big">${recap.sessions}</div>
        <div class="recap-big-sub">${recap.sessions === 1 ? 'vez' : 'vezes'}</div>
        <div class="recap-body">${sessionMsg}</div>
      </div>`
  });

  // Slide 3: Horas no tatame
  const hoursDiffPct = recap.prev.hours > 0 ? Math.round((recap.hours - recap.prev.hours) / recap.prev.hours * 100) : null;
  const hoursMsg = hoursDiffPct == null
    ? `Cada minuto conta.`
    : hoursDiffPct > 0
      ? `${hoursDiffPct}% a mais que mês passado.`
      : hoursDiffPct < 0
        ? `${Math.abs(hoursDiffPct)}% a menos que mês passado.`
        : `Mesmo tempo de treino do mês passado.`;
  slides.push({
    title: 'Tempo no tatame',
    render: () => `
      <div class="recap-content">
        <div class="recap-emoji">⏱️</div>
        <div class="recap-label">Horas treinando</div>
        <div class="recap-big">${recap.hours}<span style="font-size:32px">h</span></div>
        <div class="recap-big-sub">${recap.rolls} rolas no total</div>
        <div class="recap-body">${hoursMsg}</div>
      </div>`
  });

  // Slide 4: Finalização favorita
  if (recap.topSub) {
    slides.push({
      title: 'Finalização favorita',
      render: () => `
        <div class="recap-content">
          <div class="recap-emoji">🏆</div>
          <div class="recap-label">Sua finalização</div>
          <div class="recap-headline">${escapeHtml(recap.topSub[0])}</div>
          <div class="recap-body">Aplicada <b>${recap.topSub[1]} ${recap.topSub[1] === 1 ? 'vez' : 'vezes'}</b> este mês.<br>É o seu golpe.</div>
        </div>`
    });
  }

  // Slide 5: Combinação favorita (posição → finalização)
  if (recap.topCombo) {
    const [pos, sub] = recap.topCombo[0].split(' → ');
    slides.push({
      title: 'Combinação mais frequente',
      render: () => `
        <div class="recap-content">
          <div class="recap-emoji">⚡</div>
          <div class="recap-label">Combinação favorita</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px">
            <div style="background:rgba(255,255,255,0.2);padding:10px 20px;border-radius:20px;font-size:18px;font-weight:500">${escapeHtml(pos)}</div>
            <div style="font-size:24px">↓</div>
            <div style="background:rgba(255,255,255,0.9);color:#000;padding:10px 20px;border-radius:20px;font-size:18px;font-weight:600">${escapeHtml(sub)}</div>
          </div>
          <div class="recap-body">${recap.topCombo[1]}× este mês.<br>Seu caminho preferido até a finalização.</div>
        </div>`
    });
  }

  // Slide 6: Vulnerabilidade (onde mais caiu)
  if (recap.topVulnerability) {
    const [pos, sub] = recap.topVulnerability[0].split(' → ');
    slides.push({
      title: 'Onde você caiu',
      render: () => `
        <div class="recap-content">
          <div class="recap-emoji">🛡️</div>
          <div class="recap-label">Sua kryptonita</div>
          <div class="recap-headline">${escapeHtml(pos)}<br><span style="font-size:24px;opacity:0.8">→ ${escapeHtml(sub)}</span></div>
          <div class="recap-body">Sofreu <b>${recap.topVulnerability[1]}×</b> esse mês.<br>Mês que vem, vamos trabalhar essa defesa?</div>
        </div>`
    });
  }

  // Slide 7: Parceiro mais frequente
  if (recap.topPartner) {
    slides.push({
      title: 'Parceiro mais frequente',
      render: () => `
        <div class="recap-content">
          <div class="recap-emoji">🤝</div>
          <div class="recap-label">Seu sparring</div>
          <div class="recap-headline">${escapeHtml(recap.topPartner.name)}</div>
          <div class="recap-body">${escapeHtml(recap.topPartner.belt)} · ${recap.topPartner.weight}kg<br>Quem mais rolou com você esse mês.</div>
        </div>`
    });
  }

  // Slide 8: Mood médio
  if (recap.avgMood != null) {
    const avgRounded = Math.round(recap.avgMood * 10) / 10;
    const intMood = Math.round(avgRounded);
    slides.push({
      title: 'Como você se sentiu',
      render: () => `
        <div class="recap-content">
          <div class="recap-emoji">${moodEmoji(intMood)}</div>
          <div class="recap-label">Energia média</div>
          <div class="recap-big">${avgRounded.toFixed(1)}<span style="font-size:32px;opacity:0.6">/10</span></div>
          <div class="recap-big-sub">${moodLabel(intMood)}</div>
          <div class="recap-body">Baseado em ${recap.moodCount} ${recap.moodCount === 1 ? 'treino registrado' : 'treinos registrados'} com mood.</div>
        </div>`
    });
  }

  // Slide 9: Streak / consistência
  if (recap.maxStreak >= 2) {
    slides.push({
      title: 'Consistência',
      render: () => `
        <div class="recap-content">
          <div class="recap-emoji">⚡</div>
          <div class="recap-label">Sua maior sequência</div>
          <div class="recap-big">${recap.maxStreak}</div>
          <div class="recap-big-sub">dias seguidos no tatame</div>
          <div class="recap-body">Sem desculpa. Treino bate ponto.</div>
        </div>`
    });
  }

  // Slide 10: Competição (se teve)
  if (recap.comps > 0) {
    slides.push({
      title: 'Competições',
      render: () => `
        <div class="recap-content">
          <div class="recap-emoji">🥇</div>
          <div class="recap-label">Você competiu</div>
          <div class="recap-big">${recap.comps}</div>
          <div class="recap-big-sub">${recap.comps === 1 ? 'campeonato' : 'campeonatos'} esse mês</div>
          <div class="recap-body">Coragem de quem encara o chaveamento.</div>
        </div>`
    });
  }

  // Slide final: encerramento
  const totalCombat = recap.applied + recap.suffered;
  const finalMsg = recap.applied > recap.suffered
    ? 'Mais aplicadas que sofridas. Tá no caminho.'
    : recap.applied === recap.suffered && recap.applied > 0
      ? 'Aplicou e sofreu em peso igual. Aprendizado dos dois lados.'
      : totalCombat > 0
        ? 'Comeu cera, mas a vivência conta. Bora pra cima.'
        : 'Cada treino é um passo. Continua.';
  slides.push({
    title: 'Bora pro próximo',
    render: () => `
      <div class="recap-content">
        <div class="recap-emoji">🥋</div>
        <div class="recap-label">${monthCap} foi assim</div>
        <div class="recap-headline">${recap.sessions} ${recap.sessions === 1 ? 'treino' : 'treinos'}<br>${recap.hours}h no tatame<br>${recap.applied} ${recap.applied === 1 ? 'finalização' : 'finalizações'}</div>
        <div class="recap-body" style="margin-top:18px">${finalMsg}</div>
        <div style="margin-top:32px"><button class="recap-share-btn" style="position:static;transform:none" data-action="recap-close">Fechar retrospectiva</button></div>
      </div>`
  });

  return slides;
}

function openRecap(year, month) {
  const recap = computeMonthlyRecap(year, month);
  if (!recap.hasData) {
    showToast('Sem treinos neste mês pra montar a retrospectiva', 'error');
    return;
  }
  const slides = buildRecapSlides(recap);
  recapState = { active: true, year, month, slideIdx: 0, slides, recap };
  // Mark as seen
  const key = `${year}-${String(month + 1).padStart(2, '0')}`;
  if (!state.data.recapsDismissed) state.data.recapsDismissed = {};
  state.data.recapsDismissed[key] = true;
  persistUser();
  renderRecap();
}

function renderRecap() {
  if (!recapState.active) return;
  // Remove existing
  const existing = document.querySelector('.recap-overlay');
  if (existing) existing.remove();

  const { slideIdx, slides } = recapState;
  const slide = slides[slideIdx];
  const theme = RECAP_THEMES[slideIdx % RECAP_THEMES.length];

  const div = document.createElement('div');
  div.className = 'recap-overlay';
  div.innerHTML = `
    <div class="recap-slide" style="background:${theme.bg}">
      <div class="recap-progress">
        ${slides.map((_, i) => `<div class="recap-progress-bar ${i < slideIdx ? 'done' : i === slideIdx ? 'active' : ''}"></div>`).join('')}
      </div>
      <button class="recap-close" data-action="recap-close">${icon('x', 18)}</button>
      <div class="recap-nav-zone recap-nav-prev" data-action="recap-prev"></div>
      <div class="recap-nav-zone recap-nav-next" data-action="recap-next"></div>
      ${slide.render()}
      ${slideIdx < slides.length - 1 ? `<div class="recap-hint">Toque pra avançar →</div>` : ''}
    </div>`;
  document.body.appendChild(div);

  // Auto-advance after 4s (matches CSS animation)
  if (recapState._autoTimer) clearTimeout(recapState._autoTimer);
  if (slideIdx < slides.length - 1) {
    recapState._autoTimer = setTimeout(() => {
      if (recapState.active && recapState.slideIdx === slideIdx) {
        recapState.slideIdx++;
        renderRecap();
      }
    }, 4000);
  }
}

function closeRecap() {
  if (recapState._autoTimer) clearTimeout(recapState._autoTimer);
  recapState = { active: false, year: 0, month: 0, slideIdx: 0, slides: [] };
  const el = document.querySelector('.recap-overlay');
  if (el) el.remove();
  render();
}

function nextRecapSlide() {
  if (!recapState.active) return;
  if (recapState.slideIdx < recapState.slides.length - 1) {
    recapState.slideIdx++;
    renderRecap();
  } else {
    closeRecap();
  }
}

function prevRecapSlide() {
  if (!recapState.active) return;
  if (recapState.slideIdx > 0) {
    recapState.slideIdx--;
    renderRecap();
  }
}

// =================== MODALS ===================
let modalState = {};

function openModal(html) {
  const existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'modal-overlay';
  div.innerHTML = `<div class="modal">${html}</div>`;
  // Only close when click lands directly on the overlay backdrop (not on children)
  div.addEventListener('click', (e) => {
    if (e.target === div) closeModal();
  });
  document.body.appendChild(div);
}

function closeModal() {
  const m = document.querySelector('.modal-overlay');
  if (m) m.remove();
  modalState = {};
}

// Reconstrói, na hora, as opções dos seletores de finalização conforme o modo (Gi / No-Gi) do modal
function refreshSubmissionPickers() {
  const subs = modalState.mode === 'gi' ? SUBMISSIONS_GI : SUBMISSIONS_NOGI;
  const opts = subs.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  [['applied', '+ Adicionar finalização aplicada'], ['suffered', '+ Adicionar finalização sofrida']].forEach(([kind, label]) => {
    const sel = document.querySelector(`[data-mact="add-${kind}-picker"]`);
    if (sel) { sel.innerHTML = `<option value="">${label}</option>${opts}`; sel.value = ''; }
  });
}

// Update in-place da lista de finalizações (sem re-render do modal)
function updateSubsList(kind) {
  const counts = kind === 'applied' ? modalState.appliedCounts : modalState.sufferedCounts;
  const list = Object.entries(counts).sort();
  const total = list.reduce((s, [_, n]) => s + n, 0);
  const container = document.querySelector(`[data-subs-list="${kind}"]`);
  if (!container) return;
  container.innerHTML = list.map(([name, count]) => `
    <div class="sub-counter">
      <span class="name">${escapeHtml(name)}</span>
      <div class="actions">
        <button data-mact="dec-${kind}:${escapeHtml(name)}">−</button>
        <span class="val">${count}</span>
        <button class="plus" data-mact="inc-${kind}:${escapeHtml(name)}">+</button>
      </div>
    </div>`).join('');
  // Atualiza contador total no label
  const totalEl = document.querySelector(`[data-subs-total="${kind}"]`);
  if (totalEl) totalEl.textContent = total;
  // Atualiza badge no header do collapse
  updateDetailsBadge();
}

function updateDetailsBadge() {
  const totalApplied = Object.values(modalState.appliedCounts || {}).reduce((s, n) => s + n, 0);
  const totalSuffered = Object.values(modalState.sufferedCounts || {}).reduce((s, n) => s + n, 0);
  const badge = document.querySelector('[data-details-badge]');
  if (!badge) return;
  if (totalApplied + totalSuffered > 0) {
    badge.textContent = `${totalApplied}+${totalSuffered}`;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

// Update in-place do controle de mood (sem re-render do modal)
function updateMoodDisplay() {
  const mood = modalState.mood == null ? 7 : modalState.mood;
  const valEl = document.querySelector('.mood-value-big');
  if (valEl) valEl.textContent = mood;
  const ticks = document.querySelectorAll('.mood-tick');
  ticks.forEach((t, i) => {
    t.classList.toggle('filled', i <= mood);
    t.classList.toggle('current', i === mood);
  });
  const decBtn = document.querySelector('[data-mact="mood-dec"]');
  const incBtn = document.querySelector('[data-mact="mood-inc"]');
  if (decBtn) decBtn.disabled = mood <= 0;
  if (incBtn) incBtn.disabled = mood >= 10;
}

// Modal de confirmação customizado (substitui confirm() nativo)
function openConfirmModal(title, message, confirmLabel, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:340px;padding:24px 20px">
    <div style="font-family:'Instrument Serif',serif;font-size:22px;letter-spacing:-0.01em;margin-bottom:8px;color:var(--text)">${escapeHtml(title)}</div>
    <p style="font-size:13px;color:var(--text-2);margin:0 0 20px;line-height:1.4">${escapeHtml(message)}</p>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" id="cfm-cancel" style="flex:1">Cancelar</button>
      <button class="btn-primary" id="cfm-confirm" style="flex:1;margin:0">${escapeHtml(confirmLabel)}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
  overlay.querySelector('#cfm-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#cfm-confirm').addEventListener('click', () => {
    overlay.remove();
    onConfirm();
  });
}

function openSessionModal(date) {
  let initDate = date || todayISO();
  if (initDate > todayISO()) initDate = todayISO();
  modalState = {
    _kind: 'session',
    _editingId: null,
    date: initDate,
    mode: state.mode,
    duration: 60,
    rollCount: 3,
    // Novo formato agregado: contadores de finalização por técnica
    appliedCounts: {},   // { "Mata-leão": 2, "Armlock": 1 }
    sufferedCounts: {},  // { "Kimura": 1 }
    partnerIds: [],      // parceiros que treinou hoje
    // Legado (mantido pra compat de save):
    rolls: [makeEmptyRoll(), makeEmptyRoll(), makeEmptyRoll()],
    expandedRoll: -1,
    notes: '',
    mood: null,
    _showDetails: false,   // sessão "detalhar finalizações" dobrada
    _showNotes: false,     // sessão "notas" dobrada
    _newPartnerForRollIdx: null
  };
  renderSessionModal();

function openEditSessionModal(sessionId) {
  const s = state.data.sessions.find(x => x.id === sessionId);
  if (!s) { showToast('Treino não encontrado', 'error'); return; }
  // Agregar applied/suffered por técnica
  const appliedCounts = {};
  (s.applied || []).forEach(a => {
    if (a.submission) appliedCounts[a.submission] = (appliedCounts[a.submission] || 0) + 1;
  });
  const sufferedCounts = {};
  (s.suffered || []).forEach(a => {
    if (a.submission) sufferedCounts[a.submission] = (sufferedCounts[a.submission] || 0) + 1;
  });
  modalState = {
    _kind: 'session',
    _editingId: s.id,
    date: s.date,
    mode: s.mode,
    duration: s.duration || 60,
    rollCount: s.rolls || 3,
    appliedCounts,
    sufferedCounts,
    partnerIds: (s.partners || []).slice(),
    rolls: [], // não usado no novo modo
    expandedRoll: -1,
    notes: s.notes || '',
    mood: s.mood == null ? null : s.mood,
    _showDetails: Object.keys(appliedCounts).length > 0 || Object.keys(sufferedCounts).length > 0,
    _showNotes: !!(s.notes),
    _newPartnerForRollIdx: null
  };
  renderSessionModal();
}

  return { partnerId: '', applied: [], suffered: [], notes: '' };

  newCount = Math.max(0, Math.min(50, newCount));

      if (dateEl.value > todayISO()) {
        dateEl.value = todayISO();
        modalState.date = todayISO();
        showToast('Não é possível registrar treino futuro', 'error');
      } else {
        modalState.date = dateEl.value;
      }
    });
  }

  // Notes
  const notesEl = document.getElementById('m-notes');
  if (notesEl) {
    notesEl.addEventListener('input', () => { modalState.notes = notesEl.value; });
  }
}

function handleModalAction(a, val) {
  const [cmd, ...rest] = a.split(':');
  const arg = rest.join(':');
  switch (cmd) {
    case 'close':
      // Se estava criando parceiro dentro do modal de treino, restaura o treino
      if (modalState && modalState._kind !== 'session' && window._savedSessionModal) {
        modalState = window._savedSessionModal;
        delete window._savedSessionModal;
        renderSessionModal();
      } else {
        closeModal();
      }
      break;
    case 'set-streak-goal':
      const newGoal = parseInt(arg);
      if (newGoal >= 1 && newGoal <= 7) {
        state.data.profile.streakGoal = newGoal;
        persistUser();
        updateStreakRecord();
        closeModal();
        showToast(`Meta atualizada: ${newGoal}× por semana`);
        render();
      }
      break;
    case 'm-mode':
      // In-place: só troca classe active nos 2 chips de modo
      modalState.mode = arg;
      document.querySelectorAll('[data-mact^="m-mode:"]').forEach(el => {
        el.classList.toggle('active', el.dataset.mact === 'm-mode:' + arg);
      });
      refreshSubmissionPickers(); // as listas de finalizações dependem do modo
      break;
    case 'mood-inc':
      modalState.mood = Math.min(10, (modalState.mood == null ? 7 : modalState.mood) + 1);
      updateMoodDisplay();
      break;
    case 'mood-dec':
      modalState.mood = Math.max(0, (modalState.mood == null ? 7 : modalState.mood) - 1);
      updateMoodDisplay();
      break;
    case 'set-duration':
      // In-place: só troca classe active nos duration-btn
      modalState.duration = parseInt(arg);
      document.querySelectorAll('[data-mact^="set-duration:"]').forEach(el => {
        el.classList.toggle('active', el.dataset.mact === 'set-duration:' + arg);
      });
      break;
    case 'set-rollcount':
      // In-place: só troca classe active nos rollcount buttons
      modalState.rollCount = parseInt(arg);
      document.querySelectorAll('[data-mact^="set-rollcount:"]').forEach(el => {
        el.classList.toggle('active', el.dataset.mact === 'set-rollcount:' + arg);
      });
      break;
    case 'toggle-details':
      modalState._showDetails = !modalState._showDetails;
      renderSessionModal(); // aqui SIM re-render, muda muito conteúdo
      break;
    case 'toggle-notes':
      modalState._showNotes = !modalState._showNotes;
      renderSessionModal();
      break;
    case 'inc-applied':
      modalState.appliedCounts[arg] = (modalState.appliedCounts[arg] || 0) + 1;
      updateSubsList('applied');
      break;
    case 'dec-applied':
      if (modalState.appliedCounts[arg] > 1) modalState.appliedCounts[arg]--;
      else delete modalState.appliedCounts[arg];
      updateSubsList('applied');
      break;
    case 'inc-suffered':
      modalState.sufferedCounts[arg] = (modalState.sufferedCounts[arg] || 0) + 1;
      updateSubsList('suffered');
      break;
    case 'dec-suffered':
      if (modalState.sufferedCounts[arg] > 1) modalState.sufferedCounts[arg]--;
      else delete modalState.sufferedCounts[arg];
      updateSubsList('suffered');
      break;
    case 'add-applied-picker':
      if (val) {
        modalState.appliedCounts[val] = (modalState.appliedCounts[val] || 0) + 1;
        updateSubsList('applied');
        // Reset o select pra "+ Adicionar" default
        const sel = document.querySelector('[data-mact="add-applied-picker"]');
        if (sel) sel.value = '';
      }
      break;
    case 'add-suffered-picker':
      if (val) {
        modalState.sufferedCounts[val] = (modalState.sufferedCounts[val] || 0) + 1;
        updateSubsList('suffered');
        const sel = document.querySelector('[data-mact="add-suffered-picker"]');
        if (sel) sel.value = '';
      }
      break;
    case 'toggle-partner':
      // In-place: toggle da classe active no partner chip específico
      if (modalState.partnerIds.includes(arg)) {
        modalState.partnerIds = modalState.partnerIds.filter(x => x !== arg);
      } else {
        modalState.partnerIds.push(arg);
      }
      const partnerEl = document.querySelector(`[data-mact="toggle-partner:${arg}"]`);
      if (partnerEl) partnerEl.classList.toggle('active');
      break;
    case 'new-partner-from-session':
      window._savedSessionModal = JSON.parse(JSON.stringify(modalState));
      openPartnerModal((newPartnerId) => {
        modalState = window._savedSessionModal;
        delete window._savedSessionModal;
        if (newPartnerId !== undefined) modalState.partnerIds.push(newPartnerId);
        renderSessionModal();
      });
      break;
    case '_deprecated_m-mode':
    case 'save-session':
      saveSession();
      break;
    // COMP actions
    case 'save-comp':
      syncCompInputs();
      saveComp();
      break;
    case 'comp-result':
      modalState.result = arg;
      syncCompInputs();
      renderCompModal();
      break;
    case 'comp-mode':
      modalState.mode = arg;
      syncCompInputs();
      renderCompModal();
      break;
    case 'add-match':
      syncCompInputs();
      modalState.matches.push({ round: '', opponent: '', team: '', result: 'win', type: '', submission: '', score: '' });
      renderCompModal();
      break;
    case 'rm-match':
      syncCompInputs();
      modalState.matches.splice(parseInt(arg), 1);
      renderCompModal();
      break;
    case 'set-match':
      const [idx, field] = arg.split('|');
      modalState.matches[parseInt(idx)][field] = val;
      break;
    // Partner
    case 'save-partner':
      savePartner();
      break;
    case 'delete-partner':
      if (modalState._editingId) {
        const pid = modalState._editingId;
        openConfirmModal('Deletar parceiro', 'Os treinos existentes vão manter a referência.', 'Deletar', () => { state.data.partners = state.data.partners.filter(p => p.id !== pid); persistUser(); closeModal(); showToast('Parceiro removido'); render(); });
      }
      break;
    // Profile
    case 'save-profile':
      saveProfile();
      break;
    case 'rm-photo':
      syncProfileInputs();
      modalState.photo = null;
      renderProfileModal();
      break;
    case 'age-change':
      break;
  }
}

function syncSessionInputs() {
  // Legado - o novo modal atualiza modalState via input listeners diretamente
  // Mantido só pra não quebrar chamadas restantes
}

function saveSession() {
  if (!modalState.date) { showToast('Selecione uma data', 'error'); return; }
  if (modalState.date > todayISO()) { showToast('Data futura não permitida', 'error'); return; }
  // Converter contadores agregados em array de finalizações (uma por count)
  const allApplied = [];
  Object.entries(modalState.appliedCounts || {}).forEach(([sub, count]) => {
    for (let i = 0; i < count; i++) {
      allApplied.push({ position: '', submission: sub, partnerId: '' });
    }
  });
  const allSuffered = [];
  Object.entries(modalState.sufferedCounts || {}).forEach(([sub, count]) => {
    for (let i = 0; i < count; i++) {
      allSuffered.push({ position: '', submission: sub, partnerId: '' });
    }
  });

  const isEdit = !!modalState._editingId;
  const sessionData = {
    id: modalState._editingId || uid(),
    date: modalState.date,
    mode: modalState.mode,
    duration: modalState.duration,
    rolls: modalState.rollCount,
    partners: (modalState.partnerIds || []).slice(),
    applied: allApplied,
    suffered: allSuffered,
    rollDetails: null, // Novo formato agregado não usa rolls detalhados
    notes: modalState.notes || '',
    mood: modalState.mood
  };
  // Estado de streak ANTES de gravar (para o aviso de meta batida); falha aqui nunca pode impedir o salvamento
  let wkBefore = { metGoal: false }, streakBefore = 0;
  try { wkBefore = currentWeekStatus(); streakBefore = computeCurrentStreak(); } catch (err) { console.error('Streak (antes):', err); }
  if (isEdit) {
    const idx = state.data.sessions.findIndex(s => s.id === modalState._editingId);
    if (idx >= 0) state.data.sessions[idx] = sessionData;
    else state.data.sessions.push(sessionData); // o treino editado sumiu (ex.: removido em outro aparelho): não perde a edição
  } else {
    state.data.sessions.push(sessionData);
  }
  let wkAfter = wkBefore, streakAfter = streakBefore;
  try { updateStreakRecord(); wkAfter = currentWeekStatus(); streakAfter = computeCurrentStreak(); } catch (err) { console.error('Streak (depois):', err); }
  persistUser(); // depois do recorde, para ele ir junto na gravação

  // As telas filtram por Gi/No-Gi: mostra o modo em que o treino foi salvo, senão ele "some" da tela
  state.mode = sessionData.mode;
  closeModal();
  // Toast especial se acabou de bater a meta da semana
  if (!isEdit && !wkBefore.metGoal && wkAfter.metGoal) {
    showToast(`🔥 Meta da semana batida! Streak: ${streakAfter}`);
  } else if (!isEdit && streakAfter > streakBefore) {
    showToast(`🔥 Streak: ${streakAfter} ${streakAfter === 1 ? 'semana' : 'semanas'}!`);
  } else {
    showToast(isEdit ? 'Treino atualizado!' : 'Treino salvo!');
  }
  render();
}

function syncCompInputs() {
  const name = document.getElementById('c-name');
  const date = document.getElementById('c-date');
  const cat = document.getElementById('c-category');
  const w = document.getElementById('c-weight');
  if (name) modalState.name = name.value;
  if (date) {
    let v = date.value;
    if (v && v > todayISO()) { v = todayISO(); date.value = v; }
    modalState.date = v;
  }
  if (cat) modalState.category = cat.value;
  if (w) modalState.weightClass = w.value;
  // Sync match text fields
  document.querySelectorAll('[data-mact^="set-match:"]').forEach(el => {
    if (el.tagName === 'INPUT') {
      const [, arg] = el.dataset.mact.split(':');
      const [idx, field] = arg.split('|');
      if (modalState.matches[parseInt(idx)]) modalState.matches[parseInt(idx)][field] = el.value;
    }
  });
}

      <div class="input-row" style="margin-bottom:0"><input type="text" id="pr-name" value="${escapeHtml(modalState.name)}"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Dados básicos</label>
      <div class="input-grid-3">
        <div class="input-row" style="margin-bottom:0"><label>Idade</label><input type="number" id="pr-age" value="${modalState.age || ''}" min="3" max="99" data-mact="age-change"></div>
        <div class="input-row" style="margin-bottom:0"><label>Sexo</label>
          <select id="pr-gender">
            <option value="male" ${modalState.gender === 'male' ? 'selected' : ''}>M</option>
            <option value="female" ${modalState.gender === 'female' ? 'selected' : ''}>F</option>
          </select>
        </div>
        <div class="input-row" style="margin-bottom:0"><label>Peso</label><input type="number" id="pr-weight" value="${modalState.weight}" min="20" max="200"></div>
      </div>
      ${modalState.age && modalState.age < 16 ? `<p style="font-size:10px;color:var(--text-3);margin-top:8px;text-align:center">Sistema de faixas IBJJF Kids ativado</p>` : ''}
    </div>

    <div class="form-group">
      <label class="form-label">Graduação</label>
      <div class="input-grid-2">
        <div class="input-row" style="margin-bottom:0"><label>Faixa</label>
          <select id="pr-belt">
            ${beltsList.map(b => `<option ${validBelt === b ? 'selected' : ''}>${b}</option>`).join('')}
          </select>
        </div>
        <div class="input-row" style="margin-bottom:0"><label>Graus</label>
          <select id="pr-degrees">
            ${[0,1,2,3,4].map(d => `<option ${modalState.degrees === d ? 'selected' : ''} value="${d}">${d}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Academia</label>
      <div class="input-row" style="margin-bottom:0"><input type="text" id="pr-gym" value="${escapeHtml(modalState.gym)}" placeholder="Nome da academia"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Praticando desde</label>
      <div class="input-row" style="margin-bottom:0"><input type="number" id="pr-started" value="${modalState.startedAt}" min="1980" max="${new Date().getFullYear()}"></div>
    </div>

    <button class="btn-primary" data-mact="save-profile">Salvar</button>
    <div style="height:20px"></div>
  `);
  attachModalListeners();
  const photoInput = document.getElementById('pr-photo');
  if (photoInput) photoInput.addEventListener('change', handlePhotoSelect);
  const ageInput = document.getElementById('pr-age');
  if (ageInput) ageInput.addEventListener('change', () => {
    syncProfileInputs();
    renderProfileModal();
  });
}

function syncProfileInputs() {
  const ids = { 'pr-name':'name', 'pr-age':'age', 'pr-gender':'gender', 'pr-weight':'weight', 'pr-belt':'belt', 'pr-degrees':'degrees', 'pr-gym':'gym', 'pr-started':'startedAt' };
  for (const id in ids) {
    const el = document.getElementById(id);
    if (!el) continue;
    let v = el.value;
    if (['age','weight','degrees','startedAt'].includes(ids[id])) v = parseInt(v) || 0;
    modalState[ids[id]] = v;
  }
}

async function handlePhotoSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    // Read + resize to 200px, jpeg 0.75 quality — mantém pequeno o suficiente pro localStorage
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataUrl; });
    // Crop center square + downscale
    const size = 200;
    const min = Math.min(img.width, img.height);
    const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
    syncProfileInputs();
    const photoData = canvas.toDataURL('image/jpeg', 0.75);
    // Testar se dá pra salvar (verifica quota antes)
    const testKey = 'jjtracker_photo_test';
    try {
      localStorage.setItem(testKey, photoData);
      localStorage.removeItem(testKey);
    } catch (quotaErr) {
      showToast('Foto grande demais. Tente uma menor.', 'error');
      return;
    }
    modalState.photo = photoData;
    renderProfileModal();
  } catch (err) {
    console.error('Erro ao processar foto:', err);
    showToast('Erro ao processar foto', 'error');
  }
}

function saveProfile() {
  syncProfileInputs();
  const hadPhoto = !!state.data.profile.photo;
  state.data.profile = {
    ...state.data.profile, // preserva theme, streakGoal etc
    name: (modalState.name || '').trim() || 'Atleta',
    gender: modalState.gender || 'male',
    age: parseInt(modalState.age) || null,
    weight: parseInt(modalState.weight) || 80,
    belt: modalState.belt || 'Branca',
    degrees: parseInt(modalState.degrees) || 0,
    gym: (modalState.gym || '').trim(),
    startedAt: parseInt(modalState.startedAt) || new Date().getFullYear() - 1,
    photo: modalState.photo || null
  };
  persistUser();
  closeModal();
  const gotPhoto = !hadPhoto && state.data.profile.photo;
  showToast(gotPhoto ? '🎉 Foto adicionada! +1 freeze desbloqueado' : 'Perfil atualizado!');
  render();
}

// =================== INIT ===================
async function initApp() {
  initDelegation();
  window.addEventListener('online', () => { if (state.userId) syncNow(); });
  window.addEventListener('offline', () => { if (state.userId) setSyncStatus('offline'); });
  document.addEventListener('visibilitychange', () => {
    if (!state.userId) return;
    if (document.visibilityState === 'hidden') { if (syncStatus === 'pending') syncNow(); }
    else refreshFromCloud();
  });
  if (sb) {
    sb.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT' && state.userId && !loggingOut) {
        showToast('Sessão expirada. Entre de novo; seus dados ficaram salvos neste aparelho', 'error');
        setSyncStatus('error');
      }
    });
  }
  document.getElementById('app').innerHTML = '<div style="padding:80px 20px;text-align:center;color:var(--text-3);font-size:12px;letter-spacing:1.5px">CARREGANDO…</div>';
  let res = null;
  try {
    let session = null;
    if (sb) {
      const r = await sb.auth.getSession();
      session = r.data && r.data.session;
    }
    if (IS_RECOVERY && session) { authMode = 'recovery'; render(); return; }
    if (session && session.user) {
      res = await startSession(session.user);
    } else {
      // Sessão expirada sem conexão: abre com a cópia local da última conta
      const last = getLastUser();
      const entry = last && cacheEntry(last.id);
      if (last && entry && isValidData(entry.data) && !navigator.onLine) {
        res = await startSession({ id: last.id, email: last.email });
      }
    }
  } catch (err) {
    console.error('Erro ao restaurar sessão:', err);
  }
  if (res && res.ok) {
    state.currentTab = 'home';
    render();
    afterLogin(res);
    return;
  }
  if (res && res.error) authError = res.error;
  else if (!res) startMigration(0); // conta antiga neste aparelho e sem sessão: mostra os slides
  render();
}
initApp();
</script>
